<section id="hero" class="hero section">
  <div class="container hero__grid">
    <div class="hero__content">
      <span class="hero__badge">
        <span class="hero__badge-dot" aria-hidden="true"></span>
        Disponible para nuevos proyectos
      </span>
      <p class="hero__eyebrow">{{ cv.profile().location }}</p>
      <h1 class="hero__title">{{ cv.displayName() }}</h1>
      <p class="hero__headline">{{ cv.profile().headline }}</p>
      <p class="hero__summary">
        {{ cv.summary() }}
      </p>

      <div class="hero__actions">
        <button type="button" class="btn btn--primary" appMagnetic (click)="scrollToContact()">
          Contactar
        </button>
        <a class="btn btn--ghost" appMagnetic href="assets/cv/Cesar_Mora_CV.pdf" download>
          Descargar CV (PDF)
        </a>
        @if (cv.githubUrl(); as url) {
          <a class="btn btn--ghost" appMagnetic [href]="url" target="_blank" rel="noopener noreferrer">
            GitHub
          </a>
        }
      </div>
    </div>

    <div class="hero__panel">
      <div class="hero__avatar">
        <img
          src="assets/images/Foto%20perfil%20hoja%20de%20vida.png"
          alt="Foto de {{ cv.displayName() }}"
          width="240"
          height="240"
        />
      </div>

      <div class="hero__stat">
        <span class="hero__stat-label">Especialidad</span>
        <strong>Angular & Full Stack</strong>
      </div>
      <div class="hero__stat">
        <span class="hero__stat-label">Experiencia</span>
        <strong>Sector público y privado</strong>
      </div>
      <div class="hero__stat">
        <span class="hero__stat-label">Disponibilidad</span>
        <strong>Montería, Colombia</strong>
      </div>
    </div>
  </div>
</section>
