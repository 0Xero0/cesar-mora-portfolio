<section id="contact" class="section">
  <div class="container">
    <app-section-title
      eyebrow="Contacto"
      heading="Hablemos"
      subtitle="Disponible para oportunidades en desarrollo web, liderazgo frontend y proyectos full stack."
    />

    <div class="contact__grid" appScrollReveal>
      <div class="contact__card">
        <span>Email</span>
        <a [href]="'mailto:' + cv.profile()?.email">{{ cv.profile()?.email }}</a>
      </div>

      <div class="contact__card">
        <span>Teléfono</span>
        <a [href]="'tel:' + cv.profile()?.phone">{{ cv.profile()?.phone }}</a>
      </div>

      <div class="contact__card">
        <span>Ubicación</span>
        <strong>{{ cv.profile()?.location }}</strong>
      </div>

      @if (cv.linkedInUrl(); as url) {
        <div class="contact__card">
          <span>LinkedIn</span>
          <a [href]="url" target="_blank" rel="noopener noreferrer">Ver perfil</a>
        </div>
      }

      <div class="contact__card contact__card--wide">
        <span>CV en PDF</span>
        <a href="assets/cv/Cesar_Mora_CV.pdf" download>Descargar hoja de vida</a>
      </div>
    </div>
  </div>
</section>
