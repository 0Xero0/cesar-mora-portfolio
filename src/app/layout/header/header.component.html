<header class="header" [class.is-scrolled]="isScrolled()">
  <div class="container header__inner">
    <button type="button" class="header__brand" (click)="scrollTo('hero')">
      {{ cv.displayName() }}
    </button>

    <nav id="primary-nav" class="header__nav" [class.is-open]="menuOpen()">
      @for (item of navItems; track item.id) {
        <button
          type="button"
          class="header__link"
          [class.is-active]="activeSection() === item.id"
          (click)="scrollTo(item.id)"
        >
          {{ item.label }}
        </button>
      }
    </nav>

    <div class="header__actions">
      <button
        type="button"
        class="header__theme"
        (click)="theme.toggle()"
        [class.is-light]="theme.isLight()"
        [attr.aria-label]="theme.isLight() ? 'Activar modo oscuro' : 'Activar modo claro'"
      >
        <svg class="header__theme-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <svg class="header__theme-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <button
        type="button"
        class="header__toggle"
        (click)="toggleMenu()"
        [class.is-open]="menuOpen()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="primary-nav"
        aria-label="Abrir menú de navegación"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
