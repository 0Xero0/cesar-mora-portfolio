<footer class="footer">
  <div class="container footer__inner">
    <p>© {{ year }} {{ cv.displayName() }}. Desarrollado con Angular.</p>
    <div class="footer__links">
      @if (cv.websiteUrl(); as url) {
        <a [href]="url" target="_blank" rel="noopener noreferrer">Portfolio</a>
      }
      @if (cv.githubUrl(); as url) {
        <a [href]="url" target="_blank" rel="noopener noreferrer" rel="me">GitHub</a>
      }
      @if (cv.linkedInUrl(); as url) {
        <a [href]="url" target="_blank" rel="noopener noreferrer" rel="me">LinkedIn</a>
      }
    </div>
  </div>
</footer>
